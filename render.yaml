databases:
  - name: kiryana-postgres
    databaseName: kiryana_db
    user: kiryana_user
    plan: free

services:
  - type: web
    name: kiryana-bahi-khata
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kiryana-postgres
          property: connectionString
      - key: NODE_ENV
        value: production
